AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB table and least-privilege instance role for App Runner Cloud Notes.
Resources:
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: note_id
          AttributeType: S
      KeySchema:
        - AttributeName: note_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  AppRunnerNotesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: NotesTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt NotesTable.Arn
Outputs:
  NotesTableName:
    Value: !Ref NotesTable
  AppRunnerInstanceRoleArn:
    Value: !GetAtt AppRunnerNotesRole.Arn
